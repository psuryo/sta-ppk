<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native PDF Flipbook</title>
  
  <style>
    body {
      background-color: #2b2b2b;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    #loading {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    #flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #flipbook-container.zoomed {
      overflow: auto;
      align-items: flex-start;
      justify-content: flex-start;
      cursor: grab;
    }

    #flipbook-container.zoomed:active {
      cursor: grabbing;
    }

    #book-zoom-wrapper {
      transition: transform 0.2s ease;
      transform-origin: top left;
      min-width: fit-content;
      min-height: fit-content;
    }

    #flipbook-container.zoomed #book-zoom-wrapper {
      transform-origin: top left;
    }

    .zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 1000;
    }

    .zoom-controls button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #333;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .zoom-controls button:hover {
      background: #fff;
    }

    @media (max-width: 768px) {
      #flipbook-container {
        width: 100vw;
        height: 100vh;
      }
    }

    /* Page container styling */
    .page-wrapper {
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div id="loading">Rendering PDF Pages...</div>
  <a href="index.html" id="back-btn" style="
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(255,255,255,0.9);
    color: #333;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 1000;
    transition: background 0.2s;
  " onmouseover="this.style.background='#fff'" onmouseout="this.style.background='rgba(255,255,255,0.9)'">← Kembali</a>
  <div id="flipbook-container">
    <div id="book-zoom-wrapper">
      <div id="book"></div>
    </div>
  </div>

  <div class="zoom-controls">
    <button id="zoom-in" title="Zoom In">+</button>
    <button id="zoom-out" title="Zoom Out">−</button>
    <button id="zoom-reset" title="Reset Zoom">⟲</button>
  </div>

  <!-- 1. Include PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- 2. Include StPageFlip Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <script>
    // Define worker source for PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Read PDF filename from URL parameter, fallback to default
    const urlParams = new URLSearchParams(window.location.search);
    const PDF_URL = urlParams.get('pdf') || 'document2.pdf';

    // ===== IndexedDB Cache for rendered pages =====
    const DB_NAME = 'flipbook-cache';
    const DB_VERSION = 1;
    const STORE_NAME = 'pages';

    function openCacheDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function getCachedPages(db, pdfKey) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(pdfKey);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => resolve(null);
      });
    }

    function saveCachedPages(db, pdfKey, data) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(data, pdfKey);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    // Convert canvas to blob for storage
    function canvasToBlob(canvas, quality = 0.85) {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
      });
    }

    // Convert blob to image element
    function blobToImage(blob) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(img.src);
          resolve(img);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(blob);
      });
    }

    async function renderPDFToFlipbook() {
      const loadingEl = document.getElementById('loading');
      const bookContainer = document.getElementById('book');

      try {
        // Try to load from cache first
        const db = await openCacheDB();
        const cacheKey = PDF_URL;
        const cached = await getCachedPages(db, cacheKey);

        if (cached && cached.pages && cached.pages.length > 0) {
          // === FAST PATH: Load from cache ===
          loadingEl.innerText = 'Loading from cache...';
          const totalPages = cached.pages.length;

          for (let i = 0; i < totalPages; i++) {
            const pageData = cached.pages[i];
            const pageWrapper = document.createElement('div');
            pageWrapper.className = 'page-wrapper';

            if (i === 0 || i === totalPages - 1) {
              pageWrapper.setAttribute('data-density', 'hard');
            }

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = pageData.width;
            canvas.height = pageData.height;

            // Draw cached image onto canvas
            const img = await blobToImage(pageData.blob);
            context.drawImage(img, 0, 0, pageData.width, pageData.height);

            pageWrapper.appendChild(canvas);
            bookContainer.appendChild(pageWrapper);
          }
        } else {
          // === SLOW PATH: Render PDF and cache the result ===
          loadingEl.innerText = 'Rendering PDF Pages (first time, will be cached)...';

          const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
          const totalPages = pdf.numPages;
          const pageCache = [];

          for (let i = 1; i <= totalPages; i++) {
            loadingEl.innerText = `Rendering page ${i} of ${totalPages}...`;
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 1.5 });

            const pageWrapper = document.createElement('div');
            pageWrapper.className = 'page-wrapper';

            if (i === 1 || i === totalPages) {
              pageWrapper.setAttribute('data-density', 'hard');
            }

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({
              canvasContext: context,
              viewport: viewport
            }).promise;

            pageWrapper.appendChild(canvas);
            bookContainer.appendChild(pageWrapper);

            // Save rendered page as blob for caching
            const blob = await canvasToBlob(canvas);
            pageCache.push({
              blob: blob,
              width: canvas.width,
              height: canvas.height
            });
          }

          // Store in IndexedDB for next time
          await saveCachedPages(db, cacheKey, { pages: pageCache, timestamp: Date.now() });
        }

        loadingEl.style.display = 'none';

        // Responsive: single page on small screens, two-page spread on large screens
        const isMobile = window.innerWidth <= 768;

        const pageFlip = new St.PageFlip(bookContainer, {
          width: 700,
          height: 950,
          size: 'stretch',
          minWidth: 350,
          maxWidth: 1000,
          minHeight: 500,
          maxHeight: 1400,
          drawShadow: true,
          showCover: true,
          usePortrait: isMobile  // true = single page (mobile), false = two-page spread (desktop)
        });

        // Store reference globally for zoom control
        pageFlipInstance = pageFlip;

        // Listen for window resize to switch between single/two-page mode
        window.addEventListener('resize', () => {
          const shouldBePortrait = window.innerWidth <= 768;
          if (pageFlip.getOrientation() === 'portrait' && !shouldBePortrait) {
            pageFlip.updateFromHtml(document.querySelectorAll('.page-wrapper'));
            pageFlip.setting.usePortrait = false;
            pageFlip.update();
          } else if (pageFlip.getOrientation() === 'landscape' && shouldBePortrait) {
            pageFlip.updateFromHtml(document.querySelectorAll('.page-wrapper'));
            pageFlip.setting.usePortrait = true;
            pageFlip.update();
          }
        });

        // Load generated HTML elements into the flipbook
        pageFlip.loadFromHTML(document.querySelectorAll('.page-wrapper'));

      } catch (error) {
        console.error(error);
        loadingEl.innerText = 'Failed to load PDF. Check file path.';
      }
    }

    renderPDFToFlipbook();

    // Zoom functionality
    let currentZoom = 1;
    const zoomStep = 0.2;
    const minZoom = 0.5;
    const maxZoom = 3;
    const zoomWrapper = document.getElementById('book-zoom-wrapper');
    const flipContainer = document.getElementById('flipbook-container');
    let pageFlipInstance = null; // will be set after flipbook loads

    // Store reference to pageFlip instance from renderPDFToFlipbook
    const originalRender = renderPDFToFlipbook;

    function applyZoom() {
      zoomWrapper.style.transform = `scale(${currentZoom})`;

      if (currentZoom > 1) {
        // Zoomed in: enable scrolling, disable page flip
        flipContainer.classList.add('zoomed');
        if (pageFlipInstance) {
          pageFlipInstance.setting.disableFlipByClick = true;
          // Block flip events by adding overlay
          if (!document.getElementById('flip-blocker')) {
            const blocker = document.createElement('div');
            blocker.id = 'flip-blocker';
            blocker.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;cursor:grab;';
            zoomWrapper.style.position = 'relative';
            zoomWrapper.appendChild(blocker);
            enableDragScroll(blocker);
          }
        }
      } else {
        // Normal zoom: disable scrolling, re-enable page flip
        flipContainer.classList.remove('zoomed');
        flipContainer.scrollTop = 0;
        flipContainer.scrollLeft = 0;
        if (pageFlipInstance) {
          pageFlipInstance.setting.disableFlipByClick = false;
        }
        const blocker = document.getElementById('flip-blocker');
        if (blocker) blocker.remove();
      }
    }

    // Drag-to-scroll when zoomed in
    function enableDragScroll(blocker) {
      let isDragging = false;
      let startX, startY, scrollLeft, scrollTop;

      blocker.addEventListener('mousedown', (e) => {
        isDragging = true;
        blocker.style.cursor = 'grabbing';
        startX = e.clientX;
        startY = e.clientY;
        scrollLeft = flipContainer.scrollLeft;
        scrollTop = flipContainer.scrollTop;
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        flipContainer.scrollLeft = scrollLeft - dx;
        flipContainer.scrollTop = scrollTop - dy;
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
        blocker.style.cursor = 'grab';
      });

      // Touch drag support
      blocker.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          scrollLeft = flipContainer.scrollLeft;
          scrollTop = flipContainer.scrollTop;
        }
      });

      blocker.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        flipContainer.scrollLeft = scrollLeft - dx;
        flipContainer.scrollTop = scrollTop - dy;
        e.preventDefault();
      }, { passive: false });

      blocker.addEventListener('touchend', () => {
        isDragging = false;
      });
    }

    document.getElementById('zoom-in').addEventListener('click', () => {
      if (currentZoom < maxZoom) {
        currentZoom = Math.min(currentZoom + zoomStep, maxZoom);
        applyZoom();
      }
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      if (currentZoom > minZoom) {
        currentZoom = Math.max(currentZoom - zoomStep, minZoom);
        applyZoom();
      }
    });

    document.getElementById('zoom-reset').addEventListener('click', () => {
      currentZoom = 1;
      applyZoom();
    });

    // Mouse wheel zoom (Ctrl + scroll)
    document.getElementById('flipbook-container').addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        if (e.deltaY < 0) {
          currentZoom = Math.min(currentZoom + 0.1, maxZoom);
        } else {
          currentZoom = Math.max(currentZoom - 0.1, minZoom);
        }
        applyZoom();
      } else if (currentZoom > 1) {
        // When zoomed in, allow normal scroll to pan the content
        // (browser handles this naturally via overflow:auto)
      }
    }, { passive: false });

    // Pinch-to-zoom for touch devices
    let initialDistance = 0;
    let initialZoom = 1;

    document.getElementById('flipbook-container').addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        initialZoom = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    document.getElementById('flipbook-container').addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const currentDistance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        const scale = currentDistance / initialDistance;
        currentZoom = Math.min(Math.max(initialZoom * scale, minZoom), maxZoom);
        applyZoom();
      }
    }, { passive: false });
  </script>
</body>
</html>
