<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native PDF Flipbook</title>
  
  <style>
    body {
      background-color: #2b2b2b;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    #loading {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    #flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #flipbook-container.zoomed {
      overflow: auto;
      align-items: flex-start;
      justify-content: flex-start;
      cursor: grab;
    }

    #flipbook-container.zoomed:active {
      cursor: grabbing;
    }

    #book-zoom-wrapper {
      transition: transform 0.2s ease;
      transform-origin: top left;
      min-width: fit-content;
      min-height: fit-content;
    }

    #flipbook-container.zoomed #book-zoom-wrapper {
      transform-origin: top left;
    }

    .zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 1000;
    }

    .zoom-controls button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #333;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .zoom-controls button:hover {
      background: #fff;
    }

    @media (max-width: 768px) {
      #flipbook-container {
        width: 100vw;
        height: 100vh;
      }
    }

    /* Page container styling */
    .page-wrapper {
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Premium Error Page Styling */
    #error-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 480px;
      width: 90%;
      z-index: 100;
      animation: fadeIn 0.6s ease-out;
    }

    #error-container .error-icon {
      font-size: 4.5rem;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulseIcon 2s infinite ease-in-out;
    }

    #error-container h2 {
      color: #fff;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      letter-spacing: 0.5px;
    }

    #error-container p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 30px;
      line-height: 1.6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #error-container .error-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #1a73e8 0%, #0f3460 100%);
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 15px rgba(26, 115, 232, 0.4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #error-container .error-btn:hover {
      background: linear-gradient(135deg, #1557b0 0%, #1a73e8 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(26, 115, 232, 0.6);
    }

    #error-container .error-btn:active {
      transform: translateY(1px);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes pulseIcon {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 0px rgba(255, 179, 0, 0));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 15px rgba(255, 179, 0, 0.6));
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 0px rgba(255, 179, 0, 0));
      }
    }
  </style>
</head>
<body>

  <div id="loading">Loading pages...</div>

  <!-- Error Container for missing files -->
  <div id="error-container">
    <span class="error-icon">⚠️</span>
    <h2>Pemberitahuan</h2>
    <p>Maaf, data masih belum tersedia</p>
    <a href="index.html" class="error-btn">
      <span>←</span> Kembali ke Daftar Isi
    </a>
  </div>

  <a href="index.html" id="back-btn" style="
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(255,255,255,0.9);
    color: #333;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 1000;
    transition: background 0.2s;
  " onmouseover="this.style.background='#fff'" onmouseout="this.style.background='rgba(255,255,255,0.9)'">← Kembali</a>
  <div id="flipbook-container">
    <div id="book-zoom-wrapper">
      <div id="book"></div>
    </div>
  </div>

  <div class="zoom-controls">
    <button id="zoom-in" title="Zoom In">+</button>
    <button id="zoom-out" title="Zoom Out">−</button>
    <button id="zoom-reset" title="Reset Zoom">⟲</button>
  </div>

  <!-- Page flip navigation buttons (visible in zoom mode) -->
  <div id="nav-controls" style="
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1000;
    background: rgba(0,0,0,0.7);
    padding: 8px 16px;
    border-radius: 30px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  ">
    <button id="prev-page" title="Previous Page" style="
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: rgba(255,255,255,0.9); color: #333; font-size: 1.4rem;
      font-weight: bold; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    ">‹</button>
    <span id="page-indicator" style="
      color: #fff; font-size: 0.85rem; font-weight: 600; min-width: 80px;
      text-align: center;
    ">Page 1</span>
    <button id="next-page" title="Next Page" style="
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: rgba(255,255,255,0.9); color: #333; font-size: 1.4rem;
      font-weight: bold; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    ">›</button>
  </div>

  <!-- Include StPageFlip Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <script>
    // Read PDF filename from URL parameter, fallback to default
    const urlParams = new URLSearchParams(window.location.search);
    const PDF_URL = urlParams.get('pdf') || 'document2.pdf';

    // Extract base name without extension
    const PDF_NAME = PDF_URL.replace(/\.[^/.]+$/, "");

    async function renderPDFToFlipbook() {
      const loadingEl = document.getElementById('loading');
      const bookContainer = document.getElementById('book');

      try {
        loadingEl.innerText = 'Loading pages from server...';

        // Fetch the manifest generated on the server
        const response = await fetch(`rendered/${PDF_NAME}/manifest.json`);
        if (!response.ok) {
          throw new Error(`Failed to load manifest for ${PDF_NAME}`);
        }
        const manifest = await response.json();
        const totalPages = manifest.pagesCount;

        // Read page dimensions from the manifest
        const pdfWidth = manifest.width || 800;
        const pdfHeight = manifest.height || 1100;

        for (let i = 0; i < totalPages; i++) {
          const pageWrapper = document.createElement('div');
          pageWrapper.className = 'page-wrapper';

          if (i === 0 || i === totalPages - 1) {
            pageWrapper.setAttribute('data-density', 'hard');
          }

          // Create standard img tag to load the pre-rendered page JPEG
          const img = document.createElement('img');
          img.src = `rendered/${PDF_NAME}/page-${i + 1}.jpg`;
          img.alt = `Page ${i + 1}`;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.display = 'block';

          pageWrapper.appendChild(img);
          bookContainer.appendChild(pageWrapper);
        }

        loadingEl.style.display = 'none';

        // Responsive: single page on small screens, two-page spread on large screens
        const isMobile = window.innerWidth <= 768;
        const isLandscape = (pdfWidth / pdfHeight) > 1.15;
        const ratio = pdfWidth / pdfHeight;

        let bookWidth, bookHeight;
        let minWidth, maxWidth, minHeight, maxHeight;
        let usePortrait = isMobile;

        if (isLandscape) {
          bookWidth = 1000;
          bookHeight = Math.round(1000 / ratio);

          minWidth = 500;
          maxWidth = 1920;
          minHeight = Math.round(500 / ratio);
          maxHeight = Math.round(1920 / ratio);

          usePortrait = true; // Force single-page slideshow mode for wide documents
        } else {
          // Standard portrait book layout dimensions (in CSS pixels)
          bookWidth = 800;
          bookHeight = Math.round(800 / ratio);

          minWidth = 400;
          maxWidth = 1200;
          minHeight = Math.round(400 / ratio);
          maxHeight = Math.round(1200 / ratio);
        }

        const pageFlip = new St.PageFlip(bookContainer, {
          width: bookWidth,
          height: bookHeight,
          size: 'stretch',
          minWidth: minWidth,
          maxWidth: maxWidth,
          minHeight: minHeight,
          maxHeight: maxHeight,
          drawShadow: true,
          showCover: !isLandscape, // Cover page behavior is less appropriate for slide-style views
          usePortrait: usePortrait
        });

        // Store reference globally for zoom control
        pageFlipInstance = pageFlip;

        // Listen for window resize to switch between single/two-page mode
        window.addEventListener('resize', () => {
          if (isLandscape) return; // Keep single-page mode always for landscape documents
          const shouldBePortrait = window.innerWidth <= 768;
          if (pageFlip.getOrientation() === 'portrait' && !shouldBePortrait) {
            pageFlip.updateFromHtml(document.querySelectorAll('.page-wrapper'));
            pageFlip.setting.usePortrait = false;
            pageFlip.update();
          } else if (pageFlip.getOrientation() === 'landscape' && shouldBePortrait) {
            pageFlip.updateFromHtml(document.querySelectorAll('.page-wrapper'));
            pageFlip.setting.usePortrait = true;
            pageFlip.update();
          }
        });

        // Load generated HTML elements into the flipbook
        pageFlip.loadFromHTML(document.querySelectorAll('.page-wrapper'));

      } catch (error) {
        console.error("Error loading PDF:", error);
        
        // Hide viewer elements
        loadingEl.style.display = 'none';
        
        const flipbookContainer = document.getElementById('flipbook-container');
        if (flipbookContainer) flipbookContainer.style.display = 'none';
        
        const zoomControls = document.querySelector('.zoom-controls');
        if (zoomControls) zoomControls.style.display = 'none';
        
        const navControls = document.getElementById('nav-controls');
        if (navControls) navControls.style.display = 'none';
        
        const backBtn = document.getElementById('back-btn');
        if (backBtn) backBtn.style.display = 'none';
        
        // Show error container
        const errorContainer = document.getElementById('error-container');
        if (errorContainer) {
          errorContainer.style.display = 'flex';
        }
      }
    }

    renderPDFToFlipbook();

    // Zoom functionality
    let currentZoom = 1;
    const zoomStep = 0.2;
    const minZoom = 0.5;
    const maxZoom = 3;
    const zoomWrapper = document.getElementById('book-zoom-wrapper');
    const flipContainer = document.getElementById('flipbook-container');
    let pageFlipInstance = null; // will be set after flipbook loads

    // Store reference to pageFlip instance from renderPDFToFlipbook
    const originalRender = renderPDFToFlipbook;

    function applyZoom() {
      zoomWrapper.style.transform = `scale(${currentZoom})`;

      if (currentZoom > 1) {
        // Zoomed in: enable scrolling, disable page flip
        flipContainer.classList.add('zoomed');
        if (pageFlipInstance) {
          pageFlipInstance.setting.disableFlipByClick = true;
          // Block flip events by adding overlay
          if (!document.getElementById('flip-blocker')) {
            const blocker = document.createElement('div');
            blocker.id = 'flip-blocker';
            blocker.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;cursor:grab;';
            zoomWrapper.style.position = 'relative';
            zoomWrapper.appendChild(blocker);
            enableDragScroll(blocker);
          }
        }
      } else {
        // Normal zoom: disable scrolling, re-enable page flip
        flipContainer.classList.remove('zoomed');
        flipContainer.scrollTop = 0;
        flipContainer.scrollLeft = 0;
        if (pageFlipInstance) {
          pageFlipInstance.setting.disableFlipByClick = false;
        }
        const blocker = document.getElementById('flip-blocker');
        if (blocker) blocker.remove();
      }
    }

    // Drag-to-scroll when zoomed in
    function enableDragScroll(blocker) {
      let isDragging = false;
      let startX, startY, scrollLeft, scrollTop;

      blocker.addEventListener('mousedown', (e) => {
        isDragging = true;
        blocker.style.cursor = 'grabbing';
        startX = e.clientX;
        startY = e.clientY;
        scrollLeft = flipContainer.scrollLeft;
        scrollTop = flipContainer.scrollTop;
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        flipContainer.scrollLeft = scrollLeft - dx;
        flipContainer.scrollTop = scrollTop - dy;
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
        blocker.style.cursor = 'grab';
      });

      // Touch drag support
      blocker.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          scrollLeft = flipContainer.scrollLeft;
          scrollTop = flipContainer.scrollTop;
        }
      });

      blocker.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        flipContainer.scrollLeft = scrollLeft - dx;
        flipContainer.scrollTop = scrollTop - dy;
        e.preventDefault();
      }, { passive: false });

      blocker.addEventListener('touchend', () => {
        isDragging = false;
      });
    }

    document.getElementById('zoom-in').addEventListener('click', () => {
      if (currentZoom < maxZoom) {
        currentZoom = Math.min(currentZoom + zoomStep, maxZoom);
        applyZoom();
      }
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      if (currentZoom > minZoom) {
        currentZoom = Math.max(currentZoom - zoomStep, minZoom);
        applyZoom();
      }
    });

    document.getElementById('zoom-reset').addEventListener('click', () => {
      currentZoom = 1;
      applyZoom();
    });

    // Mouse wheel zoom (Ctrl + scroll)
    document.getElementById('flipbook-container').addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        if (e.deltaY < 0) {
          currentZoom = Math.min(currentZoom + 0.1, maxZoom);
        } else {
          currentZoom = Math.max(currentZoom - 0.1, minZoom);
        }
        applyZoom();
      } else if (currentZoom > 1) {
        // When zoomed in, allow normal scroll to pan the content
        // (browser handles this naturally via overflow:auto)
      }
    }, { passive: false });

    // Pinch-to-zoom for touch devices
    let initialDistance = 0;
    let initialZoom = 1;

    document.getElementById('flipbook-container').addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        initialZoom = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    document.getElementById('flipbook-container').addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const currentDistance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        const scale = currentDistance / initialDistance;
        currentZoom = Math.min(Math.max(initialZoom * scale, minZoom), maxZoom);
        applyZoom();
      }
    }, { passive: false });

    // === Page Navigation Buttons ===
    const pageIndicator = document.getElementById('page-indicator');

    function updatePageIndicator() {
      if (pageFlipInstance) {
        const current = pageFlipInstance.getCurrentPageIndex() + 1;
        const total = pageFlipInstance.getPageCount();
        pageIndicator.textContent = `${current} / ${total}`;
      }
    }

    document.getElementById('prev-page').addEventListener('click', () => {
      if (pageFlipInstance) {
        pageFlipInstance.flipPrev();
        // Reset zoom when flipping
        if (currentZoom > 1) {
          currentZoom = 1;
          applyZoom();
        }
        setTimeout(updatePageIndicator, 500);
      }
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (pageFlipInstance) {
        pageFlipInstance.flipNext();
        // Reset zoom when flipping
        if (currentZoom > 1) {
          currentZoom = 1;
          applyZoom();
        }
        setTimeout(updatePageIndicator, 500);
      }
    });

    // Update page indicator when flip happens (by any method)
    function attachFlipListener() {
      const checkInterval = setInterval(() => {
        // If error-container is shown, clear interval to prevent running forever
        const err = document.getElementById('error-container');
        if (err && err.style.display === 'flex') {
          clearInterval(checkInterval);
          return;
        }
        if (pageFlipInstance) {
          clearInterval(checkInterval);
          pageFlipInstance.on('flip', () => {
            setTimeout(updatePageIndicator, 100);
          });
          updatePageIndicator();
        }
      }, 500);
    }
    attachFlipListener();
  </script>
</body>
</html>
